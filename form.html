<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review for your recently purchased items using our interactive feedback form.">
    <meta name="author" content="Alagbaoso Solomon Ginikachukwu">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
    <p>Share your experience with our products.</p>
</header>

<main>

<form action="review.html" method="get">

    <!-- Product Name -->
    <fieldset>

        <legend>Product Information</legend>

        <label for="productName">
            Product Name <span class="required">*</span>
        </label>

        <select
            id="productName"
            name="productName"
            required>

            <option value="" disabled selected>
                Select a Product ...
            </option>

            <!-- JavaScript inserts product options here -->

        </select>

    </fieldset>



    <!-- Overall Rating -->
    <fieldset>

        <legend>Overall Rating <span class="required">*</span></legend>

        <div class="rating">

            <input
                type="radio"
                id="rating1"
                name="rating"
                value="1"
                required>

            <label for="rating1">☆ 1</label>


            <input
                type="radio"
                id="rating2"
                name="rating"
                value="2">

            <label for="rating2">☆☆ 2</label>


            <input
                type="radio"
                id="rating3"
                name="rating"
                value="3">

            <label for="rating3">☆☆☆ 3</label>


            <input
                type="radio"
                id="rating4"
                name="rating"
                value="4">

            <label for="rating4">☆☆☆☆ 4</label>


            <input
                type="radio"
                id="rating5"
                name="rating"
                value="5">

            <label for="rating5">☆☆☆☆☆ 5</label>

        </div>

    </fieldset>



    <!-- Installation Date -->

    <fieldset>

        <legend>Date of Installation</legend>

        <label for="installDate">
            Installation Date
            <span class="required">*</span>
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate"
            required>

    </fieldset>



    <!-- Useful Features -->

    <fieldset>

        <legend>Useful Features (Check all that apply)</legend>

        <div class="checkbox-group">

            <label for="durability">
                <input
                    type="checkbox"
                    id="durability"
                    name="features"
                    value="Durability">

                Durability
            </label>

            <label for="ease">
                <input
                    type="checkbox"
                    id="ease"
                    name="features"
                    value="Ease of Use">

                Ease of Use
            </label>

            <label for="performance">
                <input
                    type="checkbox"
                    id="performance"
                    name="features"
                    value="Performance">

                Performance
            </label>

            <label for="design">
                <input
                    type="checkbox"
                    id="design"
                    name="features"
                    value="Design">

                Design
            </label>

        </div>

    </fieldset>



    <!-- Written Review -->

    <fieldset>

        <legend>Written Review (Optional)</legend>

        <label for="review">

            Your Review

        </label>

        <textarea
            id="review"
            name="review"
            rows="6"
            placeholder="Write your review here..."></textarea>

    </fieldset>



    <!-- User Name -->

    <fieldset>

        <legend>Your Information</legend>

        <label for="userName">

            Your Name (Optional)

        </label>

        <input
            type="text"
            id="userName"
            name="userName"
            placeholder="Enter your name">

    </fieldset>



    <!-- Submit Button -->

    <div class="submit-btn">

        <input
            type="submit"
            value="Submit Review">

    </div>

</form>

</main>

<footer>

    <p>
        
        <span id="currentyear"></span>
        🌿
        Alagbaoso Solomon Ginikachukwu
        🌿
        Nigeria
    </p>

    <p id="lastModified"></p>

</footer>

<script>

document.getElementById("currentyear").textContent =
new Date().getFullYear();

document.getElementById("lastModified").textContent =
`Last Modified: ${document.lastModified}`;

</script>

</body>
</html>
